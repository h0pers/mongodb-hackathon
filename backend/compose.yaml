services:
  api:
    build: .
    ports:
      - "8000:8000"
    # MONGODB_URI and the other settings come from backend/.env.
    env_file: .env
    environment:
      # The Ollaya daemon runs on the host, not in a container.
      OLLAYA_URL: http://host.docker.internal:11435
      MEDIA_DIR: /app/media
    # Docker Desktop resolves host.docker.internal on its own; Linux needs this mapping.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./media:/app/media
    restart: unless-stopped
